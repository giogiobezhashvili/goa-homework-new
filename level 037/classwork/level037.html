<body>

    <!--  
1) class selector - გამოიყენება მაშინ, როცა გვინდა ერთნაირი სტილი მივანიჭოთ რამდენიმე ელემენტს.


id selector - გამოიყენება კონკრეტული, უნიკალური ელემენტის დასასტილავად.



class selector:
- შეიძლება ბევრ ელემენტს მიენიჭოს
- გამოიყენება ერთნაირი სტილისთვის

id selector:
- უნიკალურია და მხოლოდ ერთ ელემენტს ეკუთვნის
- გამოიყენება განსაკუთრებული სტილისთვის
 -->

    <h1 class="h1">giorgi</h1>
    <h1 class="h1">giorgi</h1>
    <h1 class="h1">giorgi</h1>
    <h1 class="h1">giorgi</h1>
    <h1 id="h1">giorgi</h1>
    <h1>giorgi</h1>
    

    
    <div>hi</div>
    <div class="div1">hi</div>
    <div id="div2">hi</div>

    
</body>
</html>
