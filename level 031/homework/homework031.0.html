<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <title>Inline CSS </title>
</head>
<body style="font-family: Arial, sans-serif; background-color: #f2f2f2; padding: 30px;">

  <h1 style="text-align:center; background-color:#111; color:white; padding:14px; border-radius:10px;">
    Inline CSS პარაგრაფები
  </h1>

  <p style="color:#222; background-color:white; padding:14px; border-left:6px solid #2a7; border-radius:8px; line-height:1.6;">
   hi giorgi
  </p>

  <p style="color:#fff; background-color:#4a67ff; padding:16px; margin-top:14px; border-radius:12px; text-align:center; font-size:18px; font-weight:bold;">
    hi giorgi
  </p>

  <p style="background-color:#0a02ff; padding:16px; margin-top:14px; border:2px dashed #ff0000; border-radius:10px; color: white;">
    და დანარჩენი ტექსტი ჩვეულებრივია.
  </p>

  <p style="background-color:#fff; padding:16px; margin-top:14px; border:1px solid #ddd; border-radius:10px;">
    <a href="#" style="color:#0a58ca; text-decoration:none; font-weight:700;">
      facebook
    </a>
  </p>

</body>
</html>
