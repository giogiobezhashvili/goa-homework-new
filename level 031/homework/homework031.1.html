<!DOCTYPE html>
<html lang="ka">
<head>
  <meta charset="UTF-8" />
  <title>Internal CSS </title>

  <style>
    
    h1 {
      font-family: Arial, sans-serif;
      padding: 14px;
      border-radius: 12px;
      margin: 12px 0;
      text-align: center;
    }

    
    .main-title {
      background-color: rgb(17, 17, 17);
      color: white;
      letter-spacing: 1px;
    }

    .highlight {
      background-color: rgb(255, 213, 77);
      color: rgb(34, 34, 34);
      border: 2px solid rgb(34, 34, 34);
    }

    
    #uniqueTitle {
      background-color: rgb(17, 187, 119);
      color: white;
      text-transform: uppercase;
    }
  </style>
</head>
<body style="background-color:rgb(244, 244, 244); padding: 30px;">

  <h1 class="main-title">ეს არის main-title</h1>
  <h1 class="main-title">ესეც main-title</h1>
  <h1 class="highlight">ეს არის highlight</h1>
  <h1 class="highlight">ესეც highlight</h1>
  <h1 id="uniqueTitle">ეს არის უნიკალური ID</h1>

</body>
</html>
