<body>
    <form>
        <div>
        <h1>Get in Touch</h1>
        <p>Fill out in below we'll get back  to you as soon as possible.</p>
        <label for="name">Name</label><br>
        <input type="text" name="name" id="name" placeholder="Your name"><br>
        <label for="email">Email</label><br>
        <input type="text" name="email" id="email" placeholder="Your email"><br>
        <label for="phone">Phone</label><br>
        <input type="text" name="phone" id="phone" placeholder="+1(234) 56789"><br>
        <label for="message">Message</label><br>
        <input type="text" name="message" id="message" placeholder="Your message"><br>
        <input type="submit" name="" id="send" value="Send Message">
        </div>
    </form>
